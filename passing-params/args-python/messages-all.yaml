version: 1.1
kind: component
name: all-message-parameters
inputs:
  - name: message1
    type: str
  - name: message2
    type: str
run:
  kind: job
  container:
    image: python:3.11
    workingDir: "{{ globals.run_artifacts_path }}/uploads/passing-params/args-python"
    command: [python3, messages.py]
    args: "{{ params.as_args }}"
