version: 1.1
kind: component
name: dictionary-parameter
inputs:
  - name: config
    type: dict
run:
  kind: job
  init:
    - file:
        content: |
          import argparse
          import json

          parser = argparse.ArgumentParser()
          parser.add_argument("--config", type=json.loads)
          args = parser.parse_args()
          print(args.config)
        filename: main.py
  container:
    image: python:3.11
    workingDir: "{{ globals.run_artifacts_path }}/uploads"
    command: [python3, main.py]
    args: ["--config={{ config }}"]
