version: 1.1
kind: component
name: experiment-with-local-code
description: Example with local code
tags: [examples]
build:
  params:
    context:
      value: "{{ globals.run_artifacts_path }}/code"
  connection: private_docker_connection
  hubRef: acme/kaniko
run:
  kind: job
  container:
    command: [python3, model.py]
