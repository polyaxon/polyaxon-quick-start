version: 1.1
kind: component
name: experiment-with-local-code
description: Example with local code
tags: [examples]
build:
  runPatch:
    init:
    - dockerfile:
        image: "tensorflow/tensorflow:2.8.0"
        run:
        - pip install keras
        - pip3 install --no-cache-dir -U polyaxon["polyboard","polytune"]
        langEnv: 'en_US.UTF-8'
        copy:
        - "{{ globals.uuid }}/code"
  connection: private_docker_connection
  hubRef: kaniko
run:
  kind: job
  container:
    command: [python3, model.py]
