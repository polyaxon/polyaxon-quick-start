version: 1.1
kind: component
name: experiment-with-local-code
description: Example with local code
tags: [examples]
build:
  runPatch:
    init:
    - git: {url: "https://github.com/polyaxon/polyaxon-quick-start"}
  params:
    destination:
      value: "polyaxon/polyaxon-quick-start:{{ globals.uuid }}"
    context:
      value: "{{ globals.artifacts_path }}/polyaxon-quick-start"
  connection: docker-connection
  hubRef: kaniko
run:
  kind: job
  container:
    command: [python3, model.py]
